apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hono-route
  namespace: hono-url-shortner
  labels:
    app.kubernetes.io/name: hono-url-shortner
    app.kubernetes.io/component: route
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: hono-url-shortner
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hono-service
          port: 8080
          weight: 1
