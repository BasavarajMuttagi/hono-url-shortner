apiVersion: v1
kind: Service
metadata:
  name: hono-service
  namespace: hono-url-shortner
  labels:
    app.kubernetes.io/name: hono-url-shortner
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app: hono-url-shortner
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
