apiVersion: v1
kind: Secret
metadata:
  name: hono-secret
  namespace: hono-url-shortner
  labels:
    app.kubernetes.io/name: hono-url-shortner
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Replace the placeholder values below with your real credentials before running `kubectl apply`
  # Alternatively: kubectl create secret generic hono-secret --namespace=hono-url-shortner --from-env-file=.env
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:PORT/DB?sslmode=require"
  REDIS_URL: "rediss://default:PASSWORD@HOST:PORT"
  CLICKHOUSE_URL: "https://HOST:PORT"
  CLICKHOUSE_PASSWORD: "YOUR_CLICKHOUSE_PASSWORD"
  SALT_SECRET: "replace-with-at-least-16-char-salt-secret"
  JWT_SECRET: "replace-with-at-least-16-char-jwt-secret"
  AXIOM_TOKEN: "YOUR_AXIOM_TOKEN_OPTIONAL"
  SEED_USER_ID: "seed-user-12345"
  SEED_USER_EMAIL: "admin@example.com"
  SEED_API_KEY: "replace-with-at-least-16-char-api-key"
