apiVersion: apps/v1
kind: Deployment
metadata:
  name: hono-url-shortner
  namespace: hono-url-shortner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hono-url-shortner
  template:
    metadata:
      labels:
        app: hono-url-shortner
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: hono-app
          image: ghcr.io/basavarajmuttagi/hono-url-shortner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: hono-config
            - secretRef:
                name: hono-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Deep Readiness Probe: tests Postgres, Valkey, and ClickHouse.
          # If any backing tier drops, K8s temporarily cuts traffic to this pod without killing it.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Shallow Liveness Probe: tests if Node.js event loop is responding.
          # Restarts the pod ONLY if process is completely deadlocked.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 3"]
