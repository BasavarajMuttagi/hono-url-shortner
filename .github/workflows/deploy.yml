name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Test Build
        run: |
          npm ci
          npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          # Convert repository name to lowercase (Docker strictly disallows uppercase letters)
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # Tag image with both 'latest' and the short commit SHA
          docker build \
            -t ${IMAGE_NAME}:latest \
            -t ${IMAGE_NAME}:${SHORT_SHA} \
            .

          # Push both tags
          docker push ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${SHORT_SHA}
